# Single internet-facing ALB: UI at /, API at /graphql and /healthz.
# Requires AWS Load Balancer Controller (installed by deploy/scripts/up.sh).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: farewatch
  namespace: farewatch
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/group.name: farewatch
spec:
  rules:
    - http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: farewatch-api
                port:
                  number: 8080
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: farewatch-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: farewatch-web
                port:
                  number: 80
