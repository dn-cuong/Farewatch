apiVersion: v1
kind: ConfigMap
metadata:
  name: farewatch-config
  namespace: farewatch
data:
  APP_ENV: "production"
  PORT: "8080"
  # Replaced by up.sh with http://<alb-dns> after Ingress is ready.
  FRONTEND_ORIGIN: "__FRONTEND_ORIGIN__"
  WORKER_COUNT: "8"
  RATE_LIMIT_PER_SEC: "20"
  CACHE_TTL_SECONDS: "900"
  HTTP_RATE_LIMIT_PER_SEC: "5"
  HTTP_RATE_LIMIT_BURST: "15"
  FARE_RETENTION_DAYS: "90"
  SMTP_HOST: "__SMTP_HOST__"
  SMTP_PORT: "__SMTP_PORT__"
  SMTP_FROM: "__SMTP_FROM__"
