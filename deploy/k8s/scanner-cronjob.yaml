apiVersion: batch/v1
kind: CronJob
metadata:
  name: farewatch-scanner
  namespace: farewatch
spec:
  # Scheduled fare scans on EKS (UTC).
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: farewatch-scanner
        spec:
          restartPolicy: Never
          containers:
            - name: scanner
              image: __ECR_API_IMAGE__
              imagePullPolicy: Always
              command: ["/app/scanner"]
              envFrom:
                - configMapRef:
                    name: farewatch-config
                - secretRef:
                    name: farewatch-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
