# Template rendered by deploy/scripts/up.sh into secret.yaml (gitignored).
# Values come from terraform outputs + repo .env (Firebase / fare APIs / SMTP).
apiVersion: v1
kind: Secret
metadata:
  name: farewatch-secrets
  namespace: farewatch
type: Opaque
stringData:
  DATABASE_URL: "__DATABASE_URL__"
  REDIS_URL: "__REDIS_URL__"
  JWT_SECRET: "__JWT_SECRET__"
  FIREBASE_PROJECT_ID: "__FIREBASE_PROJECT_ID__"
  IGNAV_API_KEY: "__IGNAV_API_KEY__"
  TRAVELPAYOUTS_TOKEN: "__TRAVELPAYOUTS_TOKEN__"
  RAPIDAPI_KEY: "__RAPIDAPI_KEY__"
  SMTP_USER: "__SMTP_USER__"
  SMTP_PASS: "__SMTP_PASS__"
