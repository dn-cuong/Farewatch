apiVersion: apps/v1
kind: Deployment
metadata:
  name: farewatch-web
  namespace: farewatch
  labels:
    app: farewatch-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: farewatch-web
  template:
    metadata:
      labels:
        app: farewatch-web
    spec:
      containers:
        - name: web
          # Pin to an explicit, immutable tag per release (never :latest) so
          # rollouts are reproducible and rollback actually rolls back.
          image: farewatch/web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: farewatch-web
  namespace: farewatch
spec:
  selector:
    app: farewatch-web
  ports:
    - name: http
      port: 80
      targetPort: 80
