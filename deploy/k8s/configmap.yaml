apiVersion: v1
kind: ConfigMap
metadata:
  name: farewatch-config
  namespace: farewatch
data:
  PORT: "8080"
  FRONTEND_ORIGIN: "https://farewatch.example.com"
  WORKER_COUNT: "8"
  RATE_LIMIT_PER_SEC: "20"
  CACHE_TTL_SECONDS: "900"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_FROM: "alerts@farewatch.app"
