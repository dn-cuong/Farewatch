apiVersion: v1
kind: ConfigMap
metadata:
  name: farewatch-config
  namespace: farewatch
data:
  APP_ENV: "production"
  PORT: "8080"
  FRONTEND_ORIGIN: "https://farewatch.example.com"
  WORKER_COUNT: "8"
  RATE_LIMIT_PER_SEC: "20"
  CACHE_TTL_SECONDS: "900"
  HTTP_RATE_LIMIT_PER_SEC: "5"
  HTTP_RATE_LIMIT_BURST: "15"
  FARE_RETENTION_DAYS: "90"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_FROM: "alerts@farewatch.app"
